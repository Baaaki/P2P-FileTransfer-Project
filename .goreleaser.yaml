# Cross-compiles the desktop client for every OS and publishes it to
# GitHub Releases.
version: 2

project_name: puresend

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: puresend
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.defaultServer={{ .Env.FT_SERVER }}
      - -X main.defaultServerList={{ envOrDefault "FT_SERVER_LIST" "https://puresend.madebybaki.com/server.txt" }}
      # Stamped so `puresend -version` can answer the first
      # question any bug report raises.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: client
    ids: [client]
    # A single binary, so ship it plainly: zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: client-deb
    package_name: puresend
    builds:
      - client
    formats:
      - deb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Baki
    homepage: https://github.com/Baaaki/PureSend
    maintainer: Baki <contact@madebybaki.com>
    description: Guvenli, sifreli, dogrudan P2P dosya transfer araci
    license: GPL-3.0
    bindir: /usr/bin
    contents:
      - src: packaging/puresend.desktop
        dst: /usr/share/applications/puresend.desktop
        file_info:
          mode: 0644
      - src: packaging/puresend.svg
        dst: /usr/share/icons/hicolor/scalable/apps/puresend.svg
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  draft: false
  header: |
    ## PureSend 🚀

    Go ile geliştirilmiş, uçtan uca şifreli (Zero-Trust) ve doğrudan eşler arası (P2P) dosya ve klasör transfer sistemi.

    ### ⚡ Hızlı Kurulum (Tek Satır)

    - **Linux & macOS (Arch, Ubuntu, Fedora, Debian, macOS):**
      ```bash
      curl -fsSL https://raw.githubusercontent.com/Baaaki/PureSend/main/install.sh | sh
      ```
    - **Windows (PowerShell):**
      ```powershell
      irm https://raw.githubusercontent.com/Baaaki/PureSend/main/install.ps1 | iex
      ```

    ---

    ### 📦 Manuel Kurulum & Doğrudan İndirme (Assets)

    - 🪟 **Windows (`x86_64`)**: `.zip` arşivini indirip çıkartın ve `puresend.exe`yi çalıştırın.
    - 📦 **Debian / Ubuntu (`amd64`)**: `.deb` paketini indirip çift tıklayarak veya `sudo dpkg -i puresend_*.deb` komutu ile kurun.
    - 🐧 **Linux (`x86_64`)**: `.tar.gz` arşivini çıkartıp doğrudan terminalden çalıştırın (`./puresend`).
    - 🍏 **macOS (Apple Silicon - M1/M2/M3/M4)**: `.tar.gz` arşivini çıkartıp terminalden çalıştırın (`./puresend`).

    ---

  footer: |
    ---
    > 💡 **macOS Notu:** macOS Gatekeeper ilk açılışta *"geliştirici doğrulanamadı"* uyarısı verirse, terminalde şu komutu çalıştırarak karantina bayrağını kaldırabilirsiniz:  
    > `xattr -d com.apple.quarantine puresend`
