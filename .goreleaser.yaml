# Cross-compiles the desktop client for every OS and publishes it to
# GitHub Releases.
#
#   export FT_SERVER=/dns4/rendezvous.madebybaki.com/tcp/443/tls/ws/p2p/12D3Koo...
#   git tag v0.1.0 && git push --tags
#
# FT_SERVER is baked into the binary, which is what lets a user just
# double-click it — no flags, no configuration. FT_SERVER_LIST is the
# address of a small text file listing the current meeting points, which a
# client reads only if FT_SERVER stops answering: it is what keeps copies
# already downloaded alive if the server ever changes address or identity.
version: 2

project_name: filetransferilla

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: filetransferilla
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.defaultServer={{ .Env.FT_SERVER }}
      - -X main.defaultServerList={{ envOrDefault "FT_SERVER_LIST" "https://p2p-filetransfer.madebybaki.com/server.txt" }}
      # Stamped so `filetransferilla -version` can answer the first
      # question any bug report raises.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

  # The server is not something users download, but shipping it means a
  # deployment can be pinned to a released version instead of to whatever
  # main happened to be at the time.
  - id: server
    main: ./cmd/server
    binary: filetransferilla-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: client
    ids: [client]
    # A single binary, so ship it plainly: zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: client-deb
    package_name: filetransferilla
    builds:
      - client
    formats:
      - deb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Baki
    homepage: https://github.com/Baaaki/P2P-FileTransfer-Project
    maintainer: Baki <contact@madebybaki.com>
    description: Guvenli, sifreli, dogrudan P2P dosya transfer araci
    license: MIT
    bindir: /usr/bin
    contents:
      - src: packaging/filetransferilla.desktop
        dst: /usr/share/applications/filetransferilla.desktop
        file_info:
          mode: 0644
      - src: packaging/filetransferilla.svg
        dst: /usr/share/icons/hicolor/scalable/apps/filetransferilla.svg
        file_info:
          mode: 0644


checksum:
  name_template: "checksums.txt"

# A machine-readable list of what went into each archive, generated with
# syft (the release workflow installs it). Anyone can then check a
# download against a vulnerability database without taking it apart.
sboms:
  - artifacts: archive

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  header: |
    ## Kurulum

    Aşağıdan işletim sistemine uygun dosyayı indir, arşivden çıkar ve çalıştır.
    Ayar yapman gerekmiyor.

  footer: |
    **macOS not:** İlk açılışta "geliştirici doğrulanamadı" uyarısı çıkarsa,
    dosyaya sağ tıklayıp *Aç* de, ya da terminalde:
    `xattr -d com.apple.quarantine filetransferilla`
