# Cross-compiles the desktop client for every OS and publishes it to
# GitHub Releases.
version: 2

project_name: puresend

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: puresend
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.defaultServer={{ .Env.FT_SERVER }}
      - -X main.defaultServerList={{ envOrDefault "FT_SERVER_LIST" "https://puresend.madebybaki.com/server.txt" }}
      # The minisign public key `puresend -update` checks releases against.
      # Empty until release signing is set up; see docs/DEPLOYMENT.md.
      - -X puresend/internal/update.publicKey={{ envOrDefault "FT_UPDATE_KEY" "" }}
      # Stamped so `puresend -version` can answer the first
      # question any bug report raises.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: client
    ids: [client]
    # A single binary, so ship it plainly: zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: client-deb
    package_name: puresend
    ids:
      - client
    formats:
      - deb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Baki
    homepage: https://github.com/Baaaki/PureSend
    maintainer: Baki <contact@madebybaki.com>
    description: Guvenli, sifreli, dogrudan P2P dosya transfer araci
    license: GPL-3.0
    bindir: /usr/bin
    contents:
      - src: packaging/puresend.desktop
        dst: /usr/share/applications/puresend.desktop
        file_info:
          mode: 0644
      - src: packaging/puresend.svg
        dst: /usr/share/icons/hicolor/scalable/apps/puresend.svg
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# checksums.txt is signed with minisign, and the signature published next
# to it. The release workflow passes --skip=sign until a key is configured.
signs:
  - id: checksums
    artifacts: checksum
    cmd: minisign
    args:
      - "-S"
      - "-s"
      - '{{ envOrDefault "MINISIGN_KEY_FILE" "" }}'
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
      - "-t"
      - "puresend {{ .Tag }} checksums"
    signature: "${artifact}.minisig"

changelog:
  disable: true

# A published release is never replaced or added to: the workflow refuses
# to run for a tag that already has one, and existing files are not
# overwritten if it somehow does.
release:
  draft: false
  header: |
    ## PureSend v2.0.0 🚀

    Go ile geliştirilmiş, uçtan uca şifreli ve doğrudan eşler arası (P2P) dosya ve klasör transfer sistemi.

    ### ⚠️ Önemli Değişiklik (Breaking Changes - Neden v2.0.0?)
    Bu sürüm, **1.0.0 sürümünün kapsamlı güvenlik denetimi** sonuçlarına göre hazırlanmış majör bir sürümdür. Buluşma (rendezvous) protokolü `/puresend/rendezvous/2.0.0` sürümüne yükseltilmiştir ve v1.0.0 istemci/sunucuları ile geriye dönük uyumlu değildir.

    #### 🛡️ Güvenlik ve Mimari Yenilikleri:
    - **Sunucu Artık Parolayı Görmüyor (Magic-Wormhole Modeli):** Kodlar ikiye ayrıldı; sunucu yalnızca açık oda numarasını (`nameplate: 42`) görür, gizli kelimeler (`kiraz-liman`) sunucuya hiç gitmez ve yalnızca eşler arasındaki PAKE el sıkışmasında kullanılır. Sunucunun MITM yapma riski tamamen ortadan kaldırıldı.
    - **Dinamik Oda Ölçekleme:** Oda numaraları en az 2 basamaktan (`10..99`) başlar ve sunucu doldukça seyreklik kuralı korunarak otomatik olarak 3, 4, 5+ basamağa dinamik olarak genişler. Eşzamanlı oda sınırı kaldırıldı.
    - **Brute-Force Koruması:** 3 yanlış kod denemesinde oda sunucudan silinerek kendini imha eder. Teyit etiketi karşı taraf anahtarı kanıtlamadan sunulmaz.
    - **DoS ve Kaynak Koruması:** Sunucu geneli global dakikalık kayıt bütçesi (`-register-budget`) kaldırıldı; tablo dolduğunda bağlantısı kopmuş odalar tahliye edilir.
    - **Bütünlük ve İmza Doğrulaması:** `puresend -update`, `install.sh` ve `install.ps1` artık `checksums.txt` üzerinden SHA-256 bütünlük kontrolü ve `minisign` dijital imza doğrulaması yapar.
    - **Dosya Sistemi Güvenliği:** Ev dizinine indirme yapılması engellendi (`CheckDestination`), sembolik linkler üzerinden dosya sızdırılması durduruldu (`checkNoLinks`), atomik hard-link (`place()`) ile TOCTOU yarış durumları önlendi.

    ---

    ### ⚡ Hızlı Kurulum (Tek Satır)

    - **Linux & macOS (Arch, Ubuntu, Fedora, Debian, macOS):**
      ```bash
      curl -fsSL https://raw.githubusercontent.com/Baaaki/PureSend/main/install.sh | sh
      ```
    - **Windows (PowerShell):**
      ```powershell
      irm https://raw.githubusercontent.com/Baaaki/PureSend/main/install.ps1 | iex
      ```

    ---

    ### 📦 Manuel Kurulum & Doğrudan İndirme (Assets)

    - 🪟 **Windows (`x86_64`)**: `.zip` arşivini indirip çıkartın ve `puresend.exe`yi çalıştırın.
    - 📦 **Debian / Ubuntu (`amd64`)**: `.deb` paketini indirip çift tıklayarak veya `sudo dpkg -i puresend_*.deb` komutu ile kurun.
    - 🐧 **Linux (`x86_64`)**: `.tar.gz` arşivini çıkartıp doğrudan terminalden çalıştırın (`./puresend`).
    - 🍏 **macOS (Apple Silicon - M1/M2/M3/M4)**: `.tar.gz` arşivini çıkartıp terminalden çalıştırın (`./puresend`).

    ---

  footer: |
    ---
    > 💡 **macOS Notu:** macOS Gatekeeper ilk açılışta *"geliştirici doğrulanamadı"* uyarısı verirse, terminalde şu komutu çalıştırarak karantina bayrağını kaldırabilirsiniz:  
    > `xattr -d com.apple.quarantine puresend`
