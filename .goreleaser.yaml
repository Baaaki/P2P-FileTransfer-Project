# Cross-compiles the desktop client for every OS and publishes it to
# GitHub Releases.
version: 2

project_name: puresend

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: puresend
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
      - goos: linux
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.defaultServer={{ .Env.FT_SERVER }}
      - -X main.defaultServerList={{ envOrDefault "FT_SERVER_LIST" "https://puresend.madebybaki.com/server.txt" }}
      # The minisign public key `puresend -update` checks releases against.
      # Empty until release signing is set up; see docs/DEPLOYMENT.md.
      - -X puresend/internal/update.publicKey={{ envOrDefault "FT_UPDATE_KEY" "" }}
      # Stamped so `puresend -version` can answer the first
      # question any bug report raises.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: client
    ids: [client]
    # A single binary, so ship it plainly: zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: client-deb
    package_name: puresend
    ids:
      - client
    formats:
      - deb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Baki
    homepage: https://github.com/Baaaki/PureSend
    maintainer: Baki <contact@madebybaki.com>
    description: Secure, encrypted, direct peer-to-peer file transfer tool
    license: GPL-3.0
    bindir: /usr/bin
    contents:
      - src: packaging/puresend.desktop
        dst: /usr/share/applications/puresend.desktop
        file_info:
          mode: 0644
      - src: packaging/puresend.svg
        dst: /usr/share/icons/hicolor/scalable/apps/puresend.svg
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

# checksums.txt is signed with minisign, and the signature published next
# to it. The release workflow passes --skip=sign until a key is configured.
signs:
  - id: checksums
    artifacts: checksum
    cmd: minisign
    args:
      - "-S"
      - "-s"
      - '{{ envOrDefault "MINISIGN_KEY_FILE" "" }}'
      - "-m"
      - "${artifact}"
      - "-x"
      - "${signature}"
      - "-t"
      - "puresend {{ .Tag }} checksums"
    signature: "${artifact}.minisig"

# The release notes come from docs/CHANGELOG.md (see release: below). This
# step has to stay enabled for that: it is the one that reads the
# --release-notes file, and disabled it would leave the notes empty.
# Given that file it generates nothing of its own from the git log.
changelog:
  disable: false

# A published release is never replaced or added to: the workflow refuses
# to run for a tag that already has one, and existing files are not
# overwritten if it somehow does.
release:
  draft: false
  # The notes between header and footer are the version's section of
  # docs/CHANGELOG.md, which the release workflow passes in with
  # --release-notes. Nothing written here may be about one version: this
  # file is the same for every release, and notes kept in it would repeat
  # on every release after the one they were written for.
  header: |
    ## PureSend {{ .Tag }}

    End-to-end encrypted, direct peer-to-peer (P2P) file and folder transfer system built with Go.

  footer: |
    ---

    ### ⚡ Quick Install (One-Line)

    - **Linux & macOS (Arch, Ubuntu, Fedora, Debian, macOS):**
      ```bash
      curl -fsSL https://raw.githubusercontent.com/Baaaki/PureSend/main/install.sh | sh
      ```
    - **Windows (PowerShell):**
      ```powershell
      irm https://raw.githubusercontent.com/Baaaki/PureSend/main/install.ps1 | iex
      ```

    ---

    ### 📦 Manual Installation & Direct Download (Assets)

    - 🪟 **Windows (`x86_64`)**: Extract the `.zip` archive and run `puresend.exe`.
    - 📦 **Debian / Ubuntu (`amd64`)**: Download the `.deb` package and install by double-clicking or running `sudo dpkg -i puresend_*.deb`.
    - 🐧 **Linux (`x86_64`)**: Extract the `.tar.gz` archive and run directly from the terminal (`./puresend`).
    - 🍏 **macOS (Apple Silicon - M1/M2/M3/M4)**: Extract the `.tar.gz` archive and run directly from the terminal (`./puresend`).

    ---
    > 💡 **macOS Note:** If macOS Gatekeeper displays an *"unverified developer"* warning on first launch, you can remove the quarantine attribute by running:  
    > `xattr -d com.apple.quarantine puresend`
