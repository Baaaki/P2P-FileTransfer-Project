# Cross-compiles the desktop client for every OS and publishes it to
# GitHub Releases.
#
#   export FT_SERVER=/dns4/rendezvous.madebybaki.com/tcp/443/tls/ws/p2p/12D3Koo...
#   git tag v0.1.0 && git push --tags
#
# FT_SERVER is baked into the binary, which is what lets a user just
# double-click it — no flags, no configuration. FT_SERVER_LIST is the
# address of a small text file listing the current meeting points, which a
# client reads only if FT_SERVER stops answering: it is what keeps copies
# already downloaded alive if the server ever changes address or identity.
version: 2

project_name: puresend

before:
  hooks:
    - go mod tidy

builds:
  - id: client
    main: ./cmd/client
    binary: puresend
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: darwin
        goarch: amd64
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.defaultServer={{ .Env.FT_SERVER }}
      - -X main.defaultServerList={{ envOrDefault "FT_SERVER_LIST" "https://puresend.madebybaki.com/server.txt" }}
      # Stamped so `puresend -version` can answer the first
      # question any bug report raises.
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

  # The server is not something users download, but shipping it means a
  # deployment can be pinned to a released version instead of to whatever
  # main happened to be at the time.
  - id: server
    main: ./cmd/server
    binary: puresend-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .Date }}

archives:
  - id: client
    ids: [client]
    # A single binary, so ship it plainly: zip on Windows, tar.gz elsewhere.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

  - id: server
    ids: [server]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}-server_{{ .Version }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - LICENSE

nfpms:
  - id: client-deb
    package_name: puresend
    builds:
      - client
    formats:
      - deb
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: Baki
    homepage: https://github.com/Baaaki/PureSend
    maintainer: Baki <contact@madebybaki.com>
    description: Guvenli, sifreli, dogrudan P2P dosya transfer araci
    license: GPL-3.0
    bindir: /usr/bin
    contents:
      - src: packaging/puresend.desktop
        dst: /usr/share/applications/puresend.desktop
        file_info:
          mode: 0644
      - src: packaging/puresend.svg
        dst: /usr/share/icons/hicolor/scalable/apps/puresend.svg
        file_info:
          mode: 0644


checksum:
  name_template: "checksums.txt"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  draft: false
  header: |
    # 📦 PureSend

    Go ile geliştirilmiş, uçtan uca şifreli (Zero-Trust) ve doğrudan eşler arası (P2P) dosya ve klasör transfer sistemi.

    ### ⚡ Hızlı Kurulum

    - **Linux & macOS:** `curl -fsSL https://puresend.madebybaki.com/install.sh | sh`
    - **Windows (PowerShell):** `irm https://puresend.madebybaki.com/install.ps1 | iex`
    - **Arch Linux (AUR):** `yay -S puresend-bin`

    ---

  footer: |
    ---
    **macOS Notu:** İlk açılışta *"geliştirici doğrulanamadı"* uyarısı çıkarsa, dosyaya sağ tıklayıp *Aç* deyin ya da terminalde şu komutu çalıştırın:
    `xattr -d com.apple.quarantine puresend`
