name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs the full history for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the server address is configured
        run: |
          SERVER="${{ vars.FT_SERVER || '/dns4/rendezvous.madebybaki.com/tcp/443/tls/ws/p2p/12D3KooWJdXaT1FN4UGLCrrTpdqvpo7cqrJZK6tHvbUPQbJ6APtK' }}"
          echo "Building release with rendezvous server: $SERVER"

      # A tag is a promise that this commit works. Check it before six
      # binaries go out under that promise, not after.
      - name: Vet and test
        run: |
          go vet ./...
          go test -race -short -timeout 15m ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FT_SERVER: ${{ vars.FT_SERVER || '/dns4/rendezvous.madebybaki.com/tcp/443/tls/ws/p2p/12D3KooWJdXaT1FN4UGLCrrTpdqvpo7cqrJZK6tHvbUPQbJ6APtK' }}
          # Where copies of the client look when the server has moved.
          # Set the FT_SERVER_LIST variable to override the landing page.
          FT_SERVER_LIST: ${{ vars.FT_SERVER_LIST || 'https://puresend.madebybaki.com/server.txt' }}
