# Rendezvous + relay server for OpenShip / plain docker compose.
#
#   docker compose up -d
#
# Only this service runs on the Ubuntu box. Nothing here ever touches the
# transferred files; it hands out addresses and bridges the first
# connection until the two peers can talk directly.
#
# This file lives at the repo root on purpose. Openship roots the build
# context at the repository for every service and ignores `context:`, so
# a compose file in a subdirectory yields a build path that points
# outside the repo — which the API rejects. Root + `context: .` makes
# both bases agree.

services:
  rendezvous:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    # The server is configured entirely through the flags below, but the
    # block is kept non-empty on purpose: the deploy API wants an
    # environment on every service, and compose normalises an empty map
    # away to nothing. UTC also keeps log timestamps comparable with the
    # timestamps Cloudflare and Openship record.
    environment:
      TZ: UTC

    command:
      - "-ws-port=8080"
      - "-health-port=8081"
      - "-key=/data/server.key"
      # Public address clients dial. Cloudflare terminates TLS on 443 and
      # forwards plain WebSocket to us, which is why clients use /tls/ws
      # while the listener above is plain /ws.
      #
      # A default rather than ${PUBLIC_HOST:?...}: the :? form refuses to
      # parse the file at all when the variable is unset, and every tool
      # that reads this compose without your shell environment — Openship
      # importing the repo, an editor, `docker compose config` — then
      # fails with "set PUBLIC_HOST" and reports it as a broken file.
      # Setting PUBLIC_HOST still overrides this.
      - "-announce=/dns4/${PUBLIC_HOST:-p2p-filetransfer.madebybaki.com}/tcp/443/tls/ws"
      # Bounded relay fallback. The relay is mainly there to bootstrap
      # hole punching (a few KB); this cap keeps a failed hole punch from
      # streaming gigabytes through your home connection and Cloudflare.
      - "-relay-data=268435456"     # 256 MB per connection
      - "-relay-duration=10m"

    ports:
      # Bound to localhost only: cloudflared reaches it over the loopback,
      # so the port is never exposed on your LAN or the internet.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"

    volumes:
      # The identity key MUST survive re-creation. The client binaries you
      # release have this server's peer ID baked in — lose the key and
      # every downloaded client breaks.
      - rendezvous-key:/data

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  rendezvous-key:
